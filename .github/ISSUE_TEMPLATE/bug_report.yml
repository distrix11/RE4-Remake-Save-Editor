name: Bug report
description: Something does not work, or the game rejects an edited save
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please never attach your save files**: they contain your Steam account id. Describe the problem and paste the diagnostics below instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open slot ...\n2. ..."
    validations:
      required: false
  - type: dropdown
    id: package
    attributes:
      label: Which package are you using?
      options:
        - GitHub all-in-one (RE4SaveEditor.exe)
        - Nexus Mods script package (start.js)
        - Built from source (node app/server.js or start.bat)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Editor version
      description: Shown in the About dialog (the "?" button).
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Did the game load the edited save?
      options:
        - Yes, it loaded and the change was there
        - No, the game rejected it or crashed
        - I did not try it in the game
        - Not related to saving
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Settings (gear button) > Copy diagnostics, then paste it here. It contains no save data, account numbers or user names."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before sending
      options:
        - label: I did not attach any save files.
          required: true
